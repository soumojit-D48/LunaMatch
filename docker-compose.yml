# LunarSync root compose — thin wrapper over infra/compose files.
# Local dev: docker compose up (defaults to dev profile below).
# GPU worker: docker compose -f docker-compose.yml -f infra/compose/docker-compose.gpu.yml up
# Prod: docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml up

include:
  - infra/compose/docker-compose.dev.yml
